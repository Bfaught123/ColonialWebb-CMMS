<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ColonialWebb CMMS frontend prototype">
  <title>Calendar · ColonialWebb CMMS</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="calendar">
  <!-- Shared sidebar and header are generated by js/app.js. -->
  <div class="app-shell">
    <aside id="sidebar" aria-label="Sidebar"></aside>
    <div class="main-column">
      <header id="topbar"></header>
      <main class="page-container">

<section class="page-heading"><div><h1>Maintenance Calendar</h1><p class="page-subtitle">See upcoming work order due dates and recurring PMs in one view.</p></div><div class="button-row"><button class="button button-outline" id="calendar-today">Today</button><button class="button button-outline" id="calendar-prev">←</button><button class="button button-outline" id="calendar-next">→</button></div></section>
<section class="calendar-layout"><div class="card"><div class="section-head"><h2 id="month-title">Calendar</h2><div class="chart-key" style="margin:0"><span><i class="key-dot"></i>Work Order</span><span><i class="key-dot light" style="background:#e6ac56"></i>PM</span></div></div><div class="calendar-grid" id="calendar-grid"></div></div><div class="card"><div class="section-head"><h2 id="selected-date">Selected Day</h2></div><div id="day-events"></div></div></section>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- All scripts are local. No server, build tools or CDN needed. -->
  <script src="js/seed.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/pages/calendar.js" defer></script>
</body>
</html>
