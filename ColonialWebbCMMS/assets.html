<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ColonialWebb CMMS frontend prototype">
  <title>Assets · ColonialWebb CMMS</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="assets">
  <!-- Shared sidebar and header are generated by js/app.js. -->
  <div class="app-shell">
    <aside id="sidebar" aria-label="Sidebar"></aside>
    <div class="main-column">
      <header id="topbar"></header>
      <main class="page-container">

<section class="page-heading"><div><h1>Asset Management</h1><p class="page-subtitle">Keep a central record of machines, locations, and maintenance history.</p></div><button class="button button-primary" id="new-asset">＋ Add Asset</button></section>
<section class="metrics" id="asset-metrics"></section>
<div class="toolbar"><input class="search" id="asset-search" placeholder="Search equipment, serial numbers, locations..."><select class="filter" id="asset-filter"><option value="">All conditions</option><option>Operational</option><option>Needs Attention</option><option>Down</option><option>Retired</option></select></div><section class="asset-grid" id="asset-grid"></section>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- All scripts are local. No server, build tools or CDN needed. -->
  <script src="js/seed.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/pages/assets.js" defer></script>
</body>
</html>
